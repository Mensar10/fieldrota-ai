<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldRota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column, three numbered steps top to bottom (what you grow → what matters → our suggestion), details folded below. */
:root{
  --bg:#eef1ea; --surface:#fafbf7; --ink:#18221c; --muted:#5a665d; --line:#d3dacd;
  --wheat:#9a5f0c; --wheat-soft:#f2e4c6; --water:#1d5e86; --water-soft:#dae7ef;
  --good:#2f6b3f; --good-soft:#dcebdf; --bad:#a13a2a; --bad-soft:#f4dfda; --bare:#d9cfbd;
  --c-cereal:#d6a23d; --c-legume:#7f9f4a; --c-oil:#e0bf3a; --c-root:#9b7a5b; --c-veg:#b98bb0; --land:#dcd5bf;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121915; --surface:#1a231e; --ink:#e8eee6; --muted:#a3b0a6; --line:#2e3b33;
  --wheat:#e2a647; --wheat-soft:#3a2c14; --water:#6fb0d9; --water-soft:#15303f;
  --good:#7fc78f; --good-soft:#1c3324; --bad:#ec8a78; --bad-soft:#3d211c; --bare:#4a4337;
  --c-cereal:#b8862c; --c-legume:#6c8a3c; --c-oil:#bfa12c; --c-root:#86684b; --c-veg:#9a7392; --land:#3b433b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1a231e; --ink:#e8eee6; --muted:#a3b0a6; --line:#2e3b33;
  --wheat:#e2a647; --wheat-soft:#3a2c14; --water:#6fb0d9; --water-soft:#15303f;
  --good:#7fc78f; --good-soft:#1c3324; --bad:#ec8a78; --bad-soft:#3d211c; --bare:#4a4337;
  --c-cereal:#b8862c; --c-legume:#6c8a3c; --c-oil:#bfa12c; --c-root:#86684b; --c-veg:#9a7392; --land:#3b433b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body)}
.wrap{max-width:980px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:22px}
header{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font:800 clamp(36px,6vw,56px)/1 var(--f-display);margin:0;letter-spacing:-.02em}
h1 span{color:var(--wheat)}
.tag{margin:6px 0 0;color:var(--muted);max-width:56ch;font-size:16px}
.lang{display:flex;gap:6px}
button,select{font:inherit;color:inherit}
.lang button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
.step{display:grid;gap:12px}
.step h2{font:700 22px/1.2 var(--f-display);margin:0;display:flex;gap:10px;align-items:center}
.step h2 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font:700 15px var(--f-mono);flex:none}
.hint{margin:0;color:var(--muted);font-size:15px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.row3{grid-template-columns:1fr}}
.row3 label{display:grid;gap:4px;font:600 13px var(--f-mono);color:var(--muted)}
select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px;font-size:17px;font-weight:600;color:var(--ink);font-family:var(--f-body)}
.presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.presets button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;cursor:pointer;font-size:14px;color:var(--ink)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.choices{grid-template-columns:1fr}}
.choices button{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.choices button b{font:700 18px var(--f-display)}
.choices button span{font-size:14px;color:var(--muted)}
.choices button[aria-pressed="true"]{border-color:var(--wheat);background:var(--wheat-soft)}
.hero{background:var(--surface);border:2px solid var(--wheat);border-radius:10px;padding:20px;display:grid;gap:16px}
.hero .k{font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wheat)}
.hero h3{font:800 clamp(26px,4.4vw,40px)/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.big{grid-template-columns:1fr}}
.big div{border-top:3px solid var(--line);padding-top:8px;display:grid;gap:2px}
.big .v{font:800 clamp(26px,3.2vw,32px)/1.05 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.big .s{font-size:14px;color:var(--muted)}
.big .water{border-color:var(--water)} .big .water .v{color:var(--water)} .big .water.more{border-color:var(--bad)} .big .water.more .v{color:var(--bad)}
.big .money{border-color:var(--wheat)} .big .money .v{color:var(--wheat)}
.big .soil{border-color:var(--good)} .big .soil .v{color:var(--good)}
.big .rule{border-color:var(--good)} .big .rule.no{border-color:var(--bad)} .big .rule .v{font-size:24px}
.big .na{border-color:var(--line)!important} .big .na .v{font-size:20px!important;color:var(--muted)!important;white-space:normal}
.why{margin:0;font-size:17px;max-width:70ch}
.climate{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.agree{font-size:14px;color:var(--ink);background:var(--water-soft);border-radius:6px;padding:8px 12px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px;table-layout:fixed}
col.lab{width:150px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}
th{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
col.sel{background:var(--wheat-soft)}
.bad{color:var(--bad)} .good{color:var(--good)}
.tl{display:grid;gap:3px;min-width:180px}
.tl .bar{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.tl .bar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1b1b14;white-space:nowrap;overflow:hidden;min-width:0;padding:0 2px}
.tl .bar .bare{background:repeating-linear-gradient(135deg,var(--bare) 0 4px,transparent 4px 8px)}
.tl .ax{font:500 11px var(--f-mono);color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:20px;display:grid;gap:5px;font-size:15px}
details h4{margin:12px 0 0;font:700 15px var(--f-display)}
details small{color:var(--muted)}
.note{background:var(--wheat-soft);border-left:4px solid var(--wheat);padding:10px 14px;border-radius:0 6px 6px 0;font-size:15px}
.size{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font:600 15px var(--f-body)}
.size input{width:120px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 10px;font:700 17px var(--f-body);color:var(--ink)}
.size input:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.plan h3{margin:0;font:700 19px var(--f-display)}
.plan ol{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plan li{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.plan li:first-child{border-top:0}
.plan .when{font:600 13px var(--f-mono);color:var(--muted)}
.plan .now .when{color:var(--wheat)}
.plan small{display:block;color:var(--muted);font-size:14px}
.plan .alt{font-size:14px;color:var(--muted);margin:0}
@media (max-width:520px){.plan li{grid-template-columns:1fr;gap:2px}}
.heat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.heat svg{width:100%;height:auto;display:block}
.heat .ax{font:500 12px var(--f-mono);fill:var(--muted)}
.heat .val{font:700 15px var(--f-display);fill:var(--ink)}
.heat .grid{stroke:var(--line);stroke-width:1}
.heat .hit{fill:transparent;cursor:default}
.heat .hit:hover + .barg path, .heat g:hover path.b{opacity:.85}
.heat p{margin:0;font-size:15px}
.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font:600 15px var(--f-body);min-height:44px}
.crumbs button{border:0;background:none;padding:0;color:var(--water);cursor:pointer;font:inherit;text-decoration:underline}
.crumbs span{color:var(--muted)}
.stage{position:relative;height:clamp(300px,50vw,470px);background:radial-gradient(ellipse at 50% 42%,var(--surface),var(--bg));touch-action:none;overflow:hidden}
#msvg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.sphere{fill:var(--water-soft);stroke:var(--line)}
.grat{fill:none;stroke:var(--water);stroke-opacity:.18;stroke-width:.6}
.c,.p{fill:var(--land);stroke:var(--surface);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
.c:hover,.p:hover{fill:var(--wheat)}
.c.pilot,.p.pilot{fill:var(--wheat-soft);stroke:var(--wheat);stroke-width:1.4}
.c.pilot:hover,.p.pilot:hover{fill:var(--wheat)}
.d{fill:var(--land);fill-opacity:.55;stroke:var(--muted);stroke-width:.8;vector-effect:non-scaling-stroke;cursor:crosshair}
.d:hover{fill-opacity:.8}
.d.pilot{fill:var(--wheat-soft);fill-opacity:.7}
.has-img .d{fill:transparent;stroke:#fff;stroke-opacity:.9}
.has-img .d.pilot{fill:transparent}
.has-img .mlab{fill:#fff;stroke:#000;stroke-opacity:.6}
.provfill{fill:var(--land);stroke:none;pointer-events:none}
.prov{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .dot{fill:#ffb83c;stroke:#2a1a04;stroke-width:1.5}
.pin.main .dot{fill:#ff8a1f}
.pin .pulse{fill:none;stroke:#ffb83c;stroke-width:2.5;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.pin .pulse{animation:pulse 1.8s ease-out infinite}}
@keyframes pulse{from{transform:scale(.7);opacity:.95}to{transform:scale(2.6);opacity:0}}
.plab{font:800 13px var(--f-body);fill:#fff;paint-order:stroke;stroke:#000;stroke-opacity:.75;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.stage:not(.sat) .plab{fill:var(--ink);stroke:var(--surface);stroke-opacity:1}
#mcan{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#msvg{position:relative}
.stage.sat{background:radial-gradient(ellipse at 50% 45%,#1a2b40,#04070b)}
.stage:not(.sat) #mcan,.stage:not(.sat) .mask{display:none}
.sat .sphere{fill:none;stroke:rgba(150,200,255,.6);stroke-width:1.5}
.sat .grat{stroke:#fff;stroke-opacity:.1}
.sat .c{fill:transparent;stroke:#fff;stroke-opacity:.35;stroke-width:.5}
.sat .c:hover{fill:rgba(255,255,255,.28)}
.sat .c.pilot{fill:rgba(255,184,60,.14);stroke:#ffb83c;stroke-opacity:.95;stroke-width:1.3}
.sat .c.pilot:hover,.sat .p.pilot:hover{fill:rgba(255,184,60,.42)}
.sat .p{fill:transparent;stroke:#fff;stroke-opacity:.6;stroke-width:.8}
.sat .p:hover{fill:rgba(255,255,255,.25)}
.sat .p.pilot{fill:rgba(255,184,60,.2);stroke:#ffb83c;stroke-opacity:1;stroke-width:2.4}
.mask{fill:#000;fill-opacity:.48;pointer-events:none}
.sat .provfill{display:none}
.sat .d{fill:transparent;stroke:#fff;stroke-opacity:.75}
.sat .d:hover{fill:rgba(255,255,255,.15)}
.sat .d.pilot{fill:rgba(255,184,60,.1)}
.sat .prov{stroke:#fff;stroke-width:2}
.sat .mlab{fill:#fff;stroke:#000;stroke-opacity:.65}
.s2box{fill:none;stroke:#ffb83c;stroke-width:1.8;stroke-dasharray:7 5;vector-effect:non-scaling-stroke;pointer-events:none}
.fpoly.sel{stroke:#ffb83c}
.fnum{font:800 13px var(--f-body);fill:#fff;paint-order:stroke;stroke:#0b2a3d;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.mlayer{position:absolute;left:10px;top:10px;z-index:1;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mleg{position:absolute;right:12px;top:16px;display:flex;align-items:center;gap:7px;font:700 12px var(--f-body);color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
.mleg i{width:10px;height:10px;border-radius:50%;background:#ffb83c;box-shadow:0 0 0 3px rgba(255,184,60,.35)}
.stage:not(.sat) .mleg{color:var(--ink);text-shadow:none}
.stage:not(.sat):not(.has-img) .mattr{color:var(--muted);text-shadow:none}
.sat .fpoly{fill:#4cc3ff;fill-opacity:.3;stroke:#7fd6ff;stroke-width:2.5}
.sat .fpoly.done{fill-opacity:.42}
.sat .fpoly.sel,.fpoly.sel{stroke:#ffb83c;stroke-width:3}
.flist{display:grid;gap:6px}
.flist ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.flist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.flist li.sel{border-color:var(--wheat)}
.fno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--water);color:#fff;font:700 13px var(--f-mono);flex:none}
.fda{font-weight:700;min-width:110px}
.flist input{width:104px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 7px;font:600 14px var(--f-body);color:var(--ink)}
.flist input[data-pf=mah]{width:150px}
.lnk{border:0;background:none;padding:2px 4px;color:var(--water);font-weight:700;cursor:pointer;text-decoration:underline;font-size:14px}
.lnk.bad{color:var(--bad)}
.mside a{color:var(--water);font-weight:700}
.pcards{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:8px}
.pchead{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;font-size:15px}
.pchead span{color:var(--muted);font-size:14px}
.pcrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.pcrow{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:168px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}.pcard{scroll-snap-align:start}}
.pcard{position:relative;display:grid;gap:3px;align-content:start;text-align:left;border:2px solid var(--line);border-radius:8px;background:var(--surface);padding:0 0 9px;cursor:pointer;overflow:hidden;color:var(--ink)}
.pcard img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;display:block;margin-bottom:4px;background:#2b3a2f}
.pcard b{font:700 14px/1.2 var(--f-display);padding:0 8px}
.pcard small{font-size:12px;color:var(--muted);padding:0 8px;line-height:1.3}
.pcard .pb{position:absolute;left:6px;top:6px;font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.68);color:#fff;padding:2px 6px;border-radius:3px}
.pcard .pb.full{background:#ffb83c;color:#2a1a04}
.pcard:hover{border-color:var(--wheat)}
.pcard[aria-pressed="true"]{border-color:var(--wheat);background:var(--wheat-soft)}
.mlab{font:600 12px var(--f-body);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.mlab.strong{font-weight:800}
.fpoly{fill:var(--water);fill-opacity:.25;stroke:var(--water);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.fpoly.done{fill-opacity:.4}
.fpt{fill:var(--surface);stroke:var(--water);stroke-width:2.5;vector-effect:non-scaling-stroke;cursor:pointer}
.mtip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:600 13px var(--f-body);padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:2}
.mctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.mctl button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font:700 20px/1 var(--f-body);cursor:pointer}
.mattr{position:absolute;left:8px;bottom:6px;font:500 11px var(--f-body);color:#fff;text-shadow:0 0 3px #000;pointer-events:none}
.mside{padding:12px 16px;display:grid;gap:8px;font-size:15px;border-top:1px solid var(--line)}
.mside p{margin:0}
.mbtns{display:flex;flex-wrap:wrap;gap:8px}
.mb{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15px}
.mb.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mok{color:var(--good)} .mnote{color:var(--muted)}
.mplace{font:600 13px var(--f-mono);color:var(--muted)}
.parcel{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end;margin:0}
.parcel legend{font-weight:700;padding:0 4px}
.parcel label{display:grid;gap:2px;font:600 12px var(--f-mono);color:var(--muted)}
.parcel input{width:140px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 8px;font:600 15px var(--f-body);color:var(--ink)}
.parcel a{color:var(--water);font-weight:700;padding-bottom:8px}
.parcel small{flex-basis:100%;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .5s ease}}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.ww{display:grid;gap:10px}.ww p{margin:0;max-width:75ch}
footer{border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.hero{transition:border-color .2s}}

/* FieldRota-AI section */
.rl{display:grid;gap:14px}
.rl .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:10px}
.rl h3{margin:0;font:700 19px var(--f-display)}
.rl .chips{display:flex;flex-wrap:wrap;gap:6px}
.rl .chip{display:grid;gap:2px;min-width:74px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:700}
.rl .chip small{font:500 11px var(--f-mono);color:var(--muted)}
.rl .chip i{display:block;height:5px;border-radius:3px}
.rl .strip{display:flex;height:26px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.rl .strip div{flex:1;min-width:0}
.rl .dec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:14px}
@media (max-width:600px){.rl .dec{grid-template-columns:1fr}}

const isFal=u=>u==="nadas"||u==="fallow"||!D.crops[u].sow;
function cycle(rot){
  const n=rot.length, spans=[]; let clash=false;
  rot.forEach((u,i)=>{ if(isFal(u)){spans.push({u,start:i*12,end:i*12+12});return;}
    const c=D.crops[u], w=c.sow>c.harvest; spans.push({u,start:w?(i-1)*12+(c.sow-1):i*12+(c.sow-1),end:i*12+c.harvest}); });
  for(let i=0;i<n;i++){const a=spans[i],b=spans[(i+1)%n],bs=b.start+(i===n-1?n*12:0); if(!isFal(a.u)&&!isFal(b.u)&&bs<a.end-1) clash=true;}
  const occ=new Array(n*12).fill(false); spans.forEach(sp=>{if(isFal(sp.u))return; for(let m=sp.start;m<sp.end;m++) occ[((m%(n*12))+n*12)%(n*12)]=true;});
  return {spans,clash,bare:occ.filter(x=>!x).length};
}
function evalRot(rot,P){
  P=P||D.periods[period]; const R=D.rotations[rot.join("|")], per=rot.map(u=>P[u]);
  const suits=per.filter(p=>p.uygunluk!==null).map(p=>+p.uygunluk), cy=cycle(rot);
  const rules=R.rules.slice(); if(cy.clash) rules.push("__clash");
  const n=rot.length, irr=Math.round(per.reduce((a,p)=>a+(+p.sulama||0),0)/n), E=D.econ, cs=rot.map(u=>D.crops[u]);
  const sales=E?cs.reduce((a,c)=>a+c.yield_kg*c.price,0)/n:0, sup=E?cs.reduce((a,c)=>a+c.support,0)/n:0, elec=E?irr*E.kwh_per_m3*E.tl_per_kwh:0;
  return {rot,per,rules,cy,suit:suits.length?Math.round(suits.reduce((a,b)=>a+b)/suits.length):0,irr,soil:R.soil,

}
const ureaKg=nkg=>nkg/KONYA.econ.urea_n, ureaTL=nkg=>ureaKg(nkg)/KONYA.econ.urea_bag_kg*KONYA.econ.urea_tl_bag;
const canon=r=>{let b=null;for(let i=0;i<r.length;i++){const x=r.slice(i).concat(r.slice(0,i)).join("|");if(b===null||x<b)b=x;}return b;};
const symDiff=(a,b)=>[...a].filter(x=>!b.has(x)).length+[...b].filter(x=>!a.has(x)).length;
function suggest(){
  const w=GOALS[goal], seen=new Set(), list=[];
  for(const key in D.rotations){ if(D.rotations[key].rules.length) continue; const rot=key.split("|"), c=canon(rot); if(seen.has(c)) continue; seen.add(c);
    if(REGION!=="konya"&&(rot.some(isFal)||new Set(rot).size<3)) continue;   // global mode, irrigated field: three different crops, no fallow (same idea as the Konya rule)
    const r=evalRot(rot); if(!r.rules.length) list.push(r); }
  const imax=Math.max(...list.map(r=>r.irr))||1, sw=w.su+w.iklim+w.toprak+w.para;
  const nmin=Math.min(...list.map(r=>r.net)), nmax=Math.max(...list.map(r=>r.net)), nsp=(nmax-nmin)||1;
  list.forEach(r=>r.total=(w.su*100*(1-r.irr/imax)+w.iklim*r.suit+w.toprak*r.soil+w.para*100*(r.net-nmin)/nsp)/sw);
  list.sort((a,b)=>b.total-a.total);
  const picks=[], cs=new Set(current);
  for(const r of list){ const s=new Set(r.rot); if(symDiff(s,cs)===0) continue; if(picks.every(p=>symDiff(new Set(p.rot),s)>=3)) picks.push(r); if(picks.length===2) break; }
  return {picks,count:list.length};

  rlFoot:(opt,pct)=>`Puan = seçtiğiniz hedef için FieldRota'nın puanı (su, toprak ve iklim uyumu, en fazla 100), yıllık ortalama; plan bölgenin en çok su isteyen ürününden fazla kuyu suyu gerektirirse 0'ın altına inebilir. Görmediği iklim modellerinde beklenen puanın tam optimumu (dinamik programlama): <b>${opt}</b>. Yapay zekâ bunun <b>%${pct}</b>'ine ulaşıyor.`,
  rlWorse:(h,f)=>`<b>Dürüst not:</b> burada basit v1 araması yapay zekâdan daha iyi sonuç veriyor${h?`: gerçek 2015–2025 havasında ${h} puan`:""}${h&&f?",":""}${f?`${h?"":":"} görmediği iklim modellerinde ${f} puan`:""}. Yapay zekâ tek tek, gürültülü hava yıllarından öğreniyor ve tarlanızın gerçek geçmişinden başlıyor; v1 ise zaten kendi nöbetinizde olduğunuzu varsayıyor ve nöbetleri ortalama iklimle puanlıyor.`,
  rlBetter:(d)=>`Burada yapay zekâ görmediği verilerde v1'den ${d} puana kadar yukarıda: tarlanızın gerçek geçmişinden başlıyor ve on yıllar ısındıkça ürün değiştiriyor.`,
  rlTie:"Yapay zekâ ve v1 neredeyse aynı cevaba varıyor: birbirinden çok farklı iki yöntemin aynı sonucu bulması öneriyi daha güvenilir kılıyor.",
  rlCurve:"Öğrenme eğrisi: ajan pratik yaparken yıllık ortalama puan (sol = başlangıç, sağ = son)",
  rlHowS:"Yapay zekâ nasıl çalışıyor ve neyi bilmiyor",
  rlHow:`<ul><li><b>Yöntem:</b> tablolu Q-öğrenme. Durum = önceki iki ürün + on yıl (CMIP6 gelecekleriyle eğitimde) ya da geçen yılın yağışı (geçmiş havayla eğitimde). Eylem = sıradaki ürün; FieldRota kurallarıyla sınırlı (ürün listesi, her üç yılda üç farklı ürün, Konya'da çok su isteyen iki ürün arka arkaya gelmez, ekim ve hasat çakışmaz).</li><li><b>Ödül:</b> FieldRota'nın yıllık puanı: kuyu suyu, iklim uyumu ve toprak sağlığı, hedefinize göre ağırlıklı.</li><li><b>Simülatör:</b> FieldRota'nın kalibre edilmiş ürün değerleri, gerçek NASA POWER havasıyla yıl yıl hesaplanıyor (ET₀, yağış, her ürünün en hassas ayında 35 °C üstü günler). Gelecek yıllar her CMIP6 modelinin 2041–2060 eğilimini ve gerçek bir geçmiş yılın iniş çıkışlarını izliyor.</li><li><b>Test:</b> 1986–2008 ve 3 iklim modeliyle eğitildi; 3 eğitim denemesinden en iyisi 2009–2014 yılları ve 4. bir modelle (MRI-ESM2-0) seçildi; hiç görmediği 2015–2025 yılları ve 2 başka modelle (GFDL-ESM4, IPSL-CM6A-LR) test edildi.</li><li><b>Sınırlar:</b> verim doğrudan simüle edilmiyor (iklim uyumu onun yerine geçiyor); tek tarla, yılda tek ana ürün; topraktaki nem birikimi ve zararlılar modelde yok; fiyatlar puana girmiyor.</li></ul>`
});
const RLCACHE={};
async function rlLoad(k){ if(!(k in RLCACHE)){ try{ RLCACHE[k]=await (await fetch(`ai/${k}.json`)).json(); }catch(e){ RLCACHE[k]=null; } } return RLCACHE[k]; }
const rlBucket=y=>y<=2035?0:(y<=2045?1:2);
function rlPath(A,g,a2,a1){ const P=A.goals[g].policy, out=[]; for(let y=2027;y<=2060;y++){ const p=P[`${a2}|${a1}`]; if(!p) break; const a=p[rlBucket(y)]; out.push({y,u:a}); a2=a1; a1=a; } return out; }
const rlCol=u=>isFal(u)?"var(--bare)":`var(${FAMC[D.crops[u].family]})`;
function rlSpark(c){ if(!c||c.length<2) return ""; const mn=Math.min(...c), mx=Math.max(...c), W=600, H=80, sx=i=>i*(W-10)/(c.length-1)+5, sy=v=>H-5-(v-mn)/((mx-mn)||1)*(H-10);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${t("rlCurve")}"><polyline fill="none" stroke="var(--good)" stroke-width="2.5" points="${c.map((v,i)=>`${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" ")}"/><text x="6" y="14" font-size="12" fill="var(--muted)">${fmt(mx,0)}</text><text x="6" y="${H-6}" font-size="12" fill="var(--muted)">${fmt(mn,0)}</text></svg>`; }
async function rlRender(){
  const sec=document.getElementById("rlSec"); if(!sec) return;
  ["rlT","rlH","rlHowS"].forEach(id=>document.getElementById(id).textContent=t(id)); document.getElementById("rlHow").innerHTML=t("rlHow");
  const reg=REGION, A=await rlLoad(reg); if(reg!==REGION) return;
  if(!A){ document.getElementById("rlPlan").innerHTML=`<p class="hint">ai/${reg}.json not found.</p>`; document.getElementById("rlTest").innerHTML=""; return; }
  const G=A.goals[goal], a2=current[1], a1=current[2], path=rlPath(A,goal,a2,a1);
  const chips=path.slice(0,10).map(p=>`<div class="chip"><small>${p.y}</small>${sh(p.u)||nm(p.u)}<i style="background:${rlCol(p.u)}"></i></div>`).join("");
  const strip=path.map(p=>`<div style="background:${rlCol(p.u)}" title="${p.y}: ${nm(p.u)}"></div>`).join("");
  const sets=[0,1,2].map(b=>[...new Set(path.filter(p=>rlBucket(p.y)===b).map(p=>p.u))]);
  const dec=sets.map((s,b)=>`<div><b>${t("rlDec")[b]}</b>${s.map(nm).join(", ")}</div>`).join("");
  // compare the settled rotation of the first decade (after the switch-over years) with the 2050s
  const early=[...new Set(path.filter(p=>p.y>=2030&&p.y<=2035).map(p=>p.u))], late=[...new Set(path.filter(p=>p.y>=2046).map(p=>p.u))];
  const drop=early.filter(u=>!late.includes(u)).map(nm).join(", "), add=late.filter(u=>!early.includes(u)).map(nm).join(", ");
  document.getElementById("rlPlan").innerHTML=`<h3>${t("rlPlanT")(nm(a2),nm(a1))}</h3><div class="chips">${chips}</div>
    <div class="hint">${t("rlStrip")}</div><div class="strip">${strip}</div><div class="dec">${dec}</div>
    <p style="margin:0">${drop||add?t("rlSwitch")(drop,add):t("rlSame")}</p>`;
  const pick=(arr,f)=>arr.find(f)||{};
  const isFarm=r=>r.policy.startsWith("Farmers");
  const H=G.hist_test, F=G.future_test;
  const rows=[["ai",r=>r.policy.startsWith("FieldRota-AI")],["v1",r=>r.policy.startsWith("FieldRota v1")],["farm",isFarm],["my",r=>r.policy.startsWith("Myopic")]];
  const cell=v=>v==null?"–":fmt(v,0), cell1=v=>v==null?"–":fmt(v,1);
  const body=rows.map(([k,f])=>{ const h=pick(H,f), fu=pick(F,f); const lab=k==="farm"?`${t("rlRows").farm}<br><small>${(G.farmer||[]).map(sh).join(" → ")}</small>`:t("rlRows")[k];
    return `<tr class="${k==="ai"?"me":""}"><th scope="row">${lab}</th><td class="num">${cell1(h.score)}</td><td class="num" style="color:var(--water)">${cell(h.irrigation_m3_da)}</td><td class="num">${cell1(fu.score)}</td><td class="num" style="color:var(--water)">${cell(fu.irrigation_m3_da)}</td><td class="num">${cell1(fu.worst_year)}</td></tr>`; }).join("");
  const ai=pick(F,rows[0][1]), v1=pick(F,rows[1][1]), opt=G.dp_opt["test models"], pct=fmt(Math.min(100,100*ai.score/opt),1);
  const aiH=pick(H,rows[0][1]), v1H=pick(H,rows[1][1]), dh=aiH.score-v1H.score, df=ai.score-v1.score;
  let verdict;
  if(Math.abs(dh)<1&&Math.abs(df)<1) verdict=t("rlTie");
  else if(dh<=-1||df<=-1) verdict=t("rlWorse")(dh<=-1?fmt(-dh,1):null, df<=-1?fmt(-df,1):null);
  else verdict=t("rlBetter")(fmt(Math.max(dh,df),1));
  document.getElementById("rlTest").innerHTML=`<h3>${t("rlTestT")}</h3><div class="tbl"><table style="min-width:640px"><colgroup><col style="width:220px"><col><col><col><col><col></colgroup><thead><tr>${t("rlCols").map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="hint" style="margin:0">${t("rlFoot")(fmt(opt,1),pct)}</p><div class="warn">${verdict}</div>
    <div class="hint">${t("rlCurve")}</div>${rlSpark(G.curve)}`;
}
{ const _r0=render; render=function(){ _r0(); rlRender(); }; }
rlRender();

</script>
